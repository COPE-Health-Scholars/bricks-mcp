# DISABLED ON THIS FORK.
#
# This workflow publishes to the WordPress.org plugin directory under the slug `bricks-mcp`,
# which belongs to the upstream author (cristianuibar), not to this fork. Publishing from
# here would push our patched build out as the official public plugin release.
#
# Two independent safeguards, so re-enabling has to be deliberate:
#   1. The `push: tags: v*` trigger is removed, so tagging a release here can never start it.
#      Only a manual dispatch can, and that requires choosing this workflow by name.
#   2. The job is gated on `github.repository`, so even a manual dispatch no-ops on the fork.
#
# The file is kept rather than deleted so that merges from upstream apply cleanly and the
# reasoning stays discoverable. release.yml still builds the distributable ZIP and attaches
# it to a GitHub Release in this repository, which is the correct channel for a fork.
#
# To re-enable intentionally (only if this fork ever owns a WP.org slug): restore the tag
# trigger, change the slug, and set the SVN_USERNAME / SVN_PASSWORD repository secrets.
#
# Original WordPress.org plugin slug: bricks-mcp
# Required repository secrets (not set on this fork): SVN_USERNAME, SVN_PASSWORD

name: Deploy to WordPress.org (disabled)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy plugin to WordPress.org
    runs-on: ubuntu-latest
    # Hard guard: never runs on a fork. Upstream's own repo is the only place this is valid.
    if: github.repository == 'cristianuibar/bricks-mcp'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies (production)
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Stamp version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Stamping version: $VERSION"
          sed -i "s/^ \* Version:.*/ * Version:           $VERSION/" bricks-mcp.php
          sed -i "s/define( 'BRICKS_MCP_VERSION', '.*' );/define( 'BRICKS_MCP_VERSION', '$VERSION' );/" bricks-mcp.php
          sed -i "s/^Stable tag:.*/Stable tag: $VERSION/" readme.txt

      - name: Build production tree for SVN
        run: |
          mkdir -p build/bricks-mcp
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.planning' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='phpcs.xml' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='.github' \
            --exclude='update-server' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='.wordpress-org' \
            --exclude='.distignore' \
            ./ build/bricks-mcp/
          test -f build/bricks-mcp/vendor/autoload.php

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          BUILD_DIR: build/bricks-mcp
