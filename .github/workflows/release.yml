# Builds the distributable plugin ZIP.
#
# Tag push (v*)        -> builds, then creates a GitHub Release in THIS repository.
# Manual dispatch      -> builds only, and uploads the ZIP as a run artifact. Use this to get
#                         an installable build of an unreleased commit (e.g. to deploy a fix
#                         to staging) without creating a tag or a public release.
#
# Note: this publishes only to this repository's Releases. Publishing to the WordPress.org
# directory is a separate workflow, deliberately disabled on this fork - see
# deploy-wordpress-org.yml.

name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies (production)
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # On a tag, the tag IS the version. On a manual dispatch there is no tag, so derive one
          # from the plugin header: bump the patch and mark it a dev build.
          #
          # The bump matters. WordPress compares plugin versions with PHP's version_compare, which
          # treats a "-dev" suffix as a PRE-release — so both 0.0.0-dev.<sha> (the original) and
          # 1.5.1-dev.<sha> sort BELOW the installed 1.5.1 and install as a downgrade. Bumping the
          # patch first gives 1.5.2-dev.<sha>, which sorts above 1.5.1 while staying clearly
          # pre-release relative to a real 1.5.2.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(grep -m1 '^ \* Version:' bricks-mcp.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
            if [ -z "$BASE" ]; then
              echo "Could not read the current version from the bricks-mcp.php header" >&2
              exit 1
            fi
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%[^0-9]*}"
            if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
              echo "Could not parse major.minor.patch from version '$BASE'" >&2
              exit 1
            fi
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev.$(git rev-parse --short HEAD)"
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^ \* Version:.*/ * Version:           $VERSION/" bricks-mcp.php
          sed -i "s/define( 'BRICKS_MCP_VERSION', '.*' );/define( 'BRICKS_MCP_VERSION', '$VERSION' );/" bricks-mcp.php
          sed -i "s/^Stable tag:.*/Stable tag: $VERSION/" readme.txt
          grep 'Version:' bricks-mcp.php | head -1
          grep 'BRICKS_MCP_VERSION' bricks-mcp.php | head -1
          grep 'Stable tag:' readme.txt | head -1

      - name: Build plugin ZIP
        run: |
          set -euo pipefail
          mkdir -p build/bricks-mcp
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.planning' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='phpcs.xml' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='.github' \
            --exclude='update-server' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='.wordpress-org' \
            --exclude='.distignore' \
            ./ build/bricks-mcp/
          test -f build/bricks-mcp/vendor/autoload.php
          cd build && zip -r "bricks-mcp.zip" bricks-mcp/

      - name: Generate SHA-256 checksum
        run: |
          cd build
          sha256sum bricks-mcp.zip > bricks-mcp.zip.sha256

      # Manual builds are downloadable from the run summary instead of becoming a release.
      - name: Upload ZIP as run artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bricks-mcp-${{ steps.version.outputs.version }}
          path: |
            build/bricks-mcp.zip
            build/bricks-mcp.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bricks-mcp.zip
            build/bricks-mcp.zip.sha256
          generate_release_notes: true
