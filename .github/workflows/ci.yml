name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allows a run to be kicked off by hand from the Actions tab or `gh workflow run ci.yml`,
  # e.g. to re-verify main without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: dom, mbstring, simplexml, tokenizer, xml, xmlwriter
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          # BEFORE is empty on workflow_dispatch and all-zeros on a branch's first push;
          # both must fall through to HEAD~1 or `git diff` gets an empty revision.
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRTUXB "$BASE" "${{ github.sha }}" | grep '\.php$' | grep -vE '^(vendor|tests)/' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No PHP files changed — PHPCS skipped"
            exit 0
          fi
          printf 'PHPCS files:\n%s\n' "${FILES[@]}"
          bash .github/scripts/phpcs-changed-lines.sh "$BASE" "${{ github.sha }}" "${FILES[@]}"

      - name: Run unit tests
        run: php vendor/bin/phpunit -c phpunit-unit.xml
